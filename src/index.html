<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="中国企业招聘信息平台 - 覆盖Fortune中国500强CS相关岗位">
  <title>中国企业招聘信息平台</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <img src="assets/icon.svg" alt="Logo" class="logo" width="36" height="36">
        <h1 class="title">中国企业招聘信息平台</h1>
        <span class="subtitle">Fortune China 500 · CS专场</span>
      </div>
      <div class="header-right">
        <button class="fav-btn" id="favToggle" title="查看收藏夹">
          <svg class="fav-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
          <span>收藏夹</span>
          <span class="fav-badge" id="favCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <!-- Search & Filter Bar -->
    <section class="toolbar">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="搜索公司、职位、城市…"
          autocomplete="off"
        >
        <button class="search-clear" id="searchClear" title="清除搜索">&times;</button>
      </div>
      <div class="filter-row">
        <div class="category-filters" id="categoryFilters">
          <!-- 由JS动态生成 -->
        </div>
        <div class="sort-box">
          <label class="campus-toggle">
            <input type="checkbox" id="campusOnly">
            <span class="toggle-label">仅校招</span>
          </label>
          <select id="sortSelect" class="sort-select">
            <option value="default">默认排序</option>
            <option value="name">按名称 A-Z</option>
            <option value="rank">按排名</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Results Info -->
    <div class="results-info">
      <span class="results-count" id="resultsCount">找到 0 家公司</span>
    </div>

    <!-- Company Cards Grid -->
    <section class="card-grid" id="cardGrid">
      <!-- 由JS动态生成 -->
    </section>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState" style="display:none;">
      <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <h3>没有找到匹配的公司</h3>
      <p>试试调整搜索条件或筛选条件</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>数据来源：各公司官网、校招页面 · Fortune China 500</p>
    <p>数据更新于 2026-05-27 · 仅供学习参考</p>
  </footer>

  <!-- Back to Top Button -->
  <button class="back-to-top" id="backToTop" title="回到顶部">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
